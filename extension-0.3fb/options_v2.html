<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>WinOCR-Html v2 设置</title>
<style>
/* =========================================================================
   WinOCR-Html v2 设置页 · 第一性原理设计
   核心：渐进披露 + 卡片分组 + 默认智能推荐
   ========================================================================= */
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --accent:#2563eb; --accent-ink:#1d4ed8; --accent-light:#dbeafe;
  --ok:#16a34a; --ok-light:#dcfce7;
  --err:#dc2626; --warn:#d97706; --warn-light:#fef3c7;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,monospace;
  --transition:200ms cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f172a; --surface:#1e293b; --surface-2:#334155;
    --text:#f1f5f9; --muted:#94a3b8; --faint:#64748b;
    --border:#334155; --border-strong:#475569;
    --accent:#3b82f6; --accent-ink:#60a5fa; --accent-light:#1e3a8a;
    --ok:#22c55e; --ok-light:#14532d;
    --err:#ef4444; --warn:#f59e0b; --warn-light:#451a03;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:var(--font);
  font-size:14px;
  line-height:1.6;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  padding:24px;
  max-width:600px;
  margin:0 auto;
}

/* ---- Header ---- */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}
.header h1{
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}
.header .version{
  font-size:11px;
  color:var(--muted);
  font-family:var(--font-mono);
}

/* ---- 推荐配置卡片 ---- */
.recommend-card{
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-ink) 100%);
  color:#fff;
  border-radius:var(--radius);
  padding:16px 20px;
  margin-bottom:20px;
  box-shadow:var(--shadow-md);
}
.recommend-card h3{
  font-size:14px;
  font-weight:600;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.recommend-card p{
  font-size:12px;
  opacity:.9;
  margin-bottom:12px;
}
.recommend-card .btn-apply{
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  padding:8px 16px;
  border-radius:var(--radius-sm);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all var(--transition);
}
.recommend-card .btn-apply:hover{background:rgba(255,255,255,.3)}

/* ---- 折叠面板 ---- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  cursor:pointer;
  transition:background var(--transition);
  user-select:none;
}
.card-header:hover{background:var(--surface-2)}
.card-header .title{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  font-size:13px;
}
.card-header .icon{
  width:28px;
  height:28px;
  background:var(--accent-light);
  color:var(--accent);
  border-radius:var(--radius-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}
.card-header .arrow{
  color:var(--muted);
  transition:transform var(--transition);
  font-size:12px;
}
.card.open .arrow{transform:rotate(180deg)}

.card-body{
  max-height:0;
  overflow:hidden;
  transition:max-height var(--transition);
}
.card.open .card-body{
  max-height:800px;
}
.card-content{
  padding:0 16px 16px;
}

/* ---- 表单元素 ---- */
.field{
  margin-bottom:14px;
}
.field:last-child{margin-bottom:0}
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.3px;
}
.field .hint{
  font-size:11px;
  color:var(--faint);
  margin-top:4px;
  line-height:1.5;
}
.input-row{
  display:flex;
  gap:8px;
  align-items:center;
}
.input-row .grow{flex:1}

input[type="text"],input[type="password"],input[type="number"],input[type="email"],select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--bg);
  color:var(--text);
  font-size:13px;
  font-family:var(--font);
  transition:border-color var(--transition), box-shadow var(--transition);
}
input:hover,select:hover{border-color:var(--border-strong)}
input:focus,select:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-light);
}

/* ---- 引擎选择卡片 ---- */
.engine-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.engine-card{
  padding:10px 12px;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:all var(--transition);
  text-align:center;
}
.engine-card:hover{border-color:var(--accent)}
.engine-card.active{
  border-color:var(--accent);
  background:var(--accent-light);
}
.engine-card .name{font-size:13px;font-weight:600;margin-bottom:2px}
.engine-card .desc{font-size:10px;color:var(--muted)}
.engine-card .badge{
  font-size:9px;
  padding:2px 6px;
  border-radius:10px;
  background:var(--ok);
  color:#fff;
  margin-top:4px;
  display:inline-block;
}

/* ---- 切换开关 ---- */
.toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}
.toggle-row:last-child{border:none}
.toggle-row label{font-size:13px}
.toggle{
  width:44px;
  height:24px;
  background:var(--border-strong);
  border-radius:12px;
  position:relative;
  cursor:pointer;
  transition:background var(--transition);
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  background:#fff;
  border-radius:50%;
  top:2px;
  left:2px;
  transition:transform var(--transition);
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.on::after{transform:translateX(20px)}

/* ---- 按钮 ---- */
.btn{
  padding:10px 18px;
  border:none;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all var(--transition);
}
.btn-primary{
  background:var(--accent);
  color:#fff;
}
.btn-primary:hover{background:var(--accent-ink)}
.btn-ghost{
  background:transparent;
  color:var(--accent);
  border:1px solid var(--accent);
}
.btn-ghost:hover{background:var(--accent-light)}

/* ---- Toast ---- */
.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  padding:12px 20px;
  background:var(--text);
  color:var(--surface);
  font-size:13px;
  border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);
  opacity:0;
  transform:translateY(10px);
  transition:all var(--transition);
  z-index:100;
}
.toast.show{opacity:1;transform:none}
.toast.success{background:var(--ok)}
.toast.error{background:var(--err)}

/* ---- 滚动条 ---- */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
</style>
</head>
<body>
<header class="header">
  <h1>⚙️ 设置</h1>
  <span class="version">v0.8.0</span>
</header>

<!-- 推荐配置卡片 -->
<div class="recommend-card">
  <h3>🌟 推荐配置</h3>
  <p>SiliconFlow（翻译）+ PP-OCRv6 Tiny（OCR），开箱即用，质量最佳</p>
  <button class="btn-apply" id="applyRecommended">一键应用推荐配置</button>
</div>

<!-- 折叠面板：引擎配置 -->
<div class="card open">
  <div class="card-header">
    <span class="title"><span class="icon">🌐</span> 翻译引擎</span>
    <span class="arrow">▼</span>
  </div>
  <div class="card-body">
    <div class="card-content">
      <div class="engine-grid">
        <div class="engine-card active" data-engine="sf">
          <div class="name">SiliconFlow</div>
          <div class="desc">质量最好 · 需 Key</div>
          <span class="badge">推荐</span>
        </div>
        <div class="engine-card" data-engine="mymemory">
          <div class="name">MyMemory</div>
          <div class="desc">免费 · 免 Key</div>
        </div>
        <div class="engine-card" data-engine="ollama">
          <div class="name">本地 Ollama</div>
          <div class="desc">离线 · 隐私</div>
        </div>
        <div class="engine-card" data-engine="browser">
          <div class="name">浏览器内置</div>
          <div class="desc">零配置</div>
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label>SiliconFlow API Key</label>
        <div class="input-row">
          <input type="password" class="grow" id="sfKey" placeholder="sk-..." />
          <button class="btn btn-ghost" id="testSf">测试</button>
        </div>
        <div class="hint">从 <a href="https://cloud.siliconflow.cn" target="_blank">cloud.siliconflow.cn</a> 获取</div>
      </div>
      <div class="field">
        <label>Ollama 服务地址</label>
        <input type="text" id="ollamaUrl" placeholder="http://localhost:11434" />
      </div>
      <div class="field">
        <label>MyMemory 邮箱（可选）</label>
        <input type="email" id="mymemoryEmail" placeholder="填了额度 5000 → 50000" />
      </div>
    </div>
  </div>
</div>

<!-- 折叠面板：OCR 配置 -->
<div class="card">
  <div class="card-header">
    <span class="title"><span class="icon">📷</span> OCR 配置</span>
    <span class="arrow">▼</span>
  </div>
  <div class="card-body">
    <div class="card-content">
      <div class="field">
        <label>OCR 引擎</label>
        <select id="ocrEngine">
          <option value="local">本地 PP-OCRv6（推荐 · ~1.5s）</option>
          <option value="sf">云端 SiliconFlow（适合复杂版面）</option>
        </select>
      </div>
      <div class="field">
        <label>本地 OCR 档位</label>
        <select id="localOcrTier">
          <option value="tiny">Tiny（6.6MB · 速度快）</option>
          <option value="medium">Medium（133MB · 更准）</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- 折叠面板：热键配置 -->
<div class="card">
  <div class="card-header">
    <span class="title"><span class="icon">⌨️</span> 热键配置</span>
    <span class="arrow">▼</span>
  </div>
  <div class="card-body">
    <div class="card-content">
      <div class="field">
        <label>截图热键</label>
        <div class="input-row">
          <input type="text" class="grow" id="hotkey" readonly placeholder="点击输入组合键..." />
          <button class="btn btn-ghost" id="clearHotkey">清空</button>
        </div>
        <div class="hint">点击输入框，然后按下组合键</div>
      </div>
      <div class="field">
        <label>退出热键</label>
        <div class="input-row">
          <input type="text" class="grow" id="quitHotkey" readonly placeholder="点击输入组合键..." />
          <button class="btn btn-ghost" id="clearQuit">清空</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 折叠面板：导出配置 -->
<div class="card">
  <div class="card-header">
    <span class="title"><span class="icon">📤</span> 导出配置</span>
    <span class="arrow">▼</span>
  </div>
  <div class="card-body">
    <div class="card-content">
      <div class="toggle-row">
        <label>文件夹导出</label>
        <div class="toggle" id="toggleFolder"></div>
      </div>
      <div class="toggle-row">
        <label>ZIP 归档</label>
        <div class="toggle" id="toggleZip"></div>
      </div>
      <div class="toggle-row">
        <label>Obsidian</label>
        <div class="toggle" id="toggleObsidian"></div>
      </div>
      <div class="toggle-row">
        <label>乐享笔记</label>
        <div class="toggle" id="toggleLexiang"></div>
      </div>
    </div>
  </div>
</div>

<!-- 底部按钮 -->
<div style="display:flex;gap:8px;margin-top:20px">
  <button class="btn btn-primary" style="flex:1" id="save">保存设置</button>
  <button class="btn btn-ghost" id="reset">恢复默认</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// 折叠面板
document.querySelectorAll('.card-header').forEach(hd => {
  hd.addEventListener('click', () => {
    hd.parentElement.classList.toggle('open');
  });
});

// 引擎选择
document.querySelectorAll('.engine-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.engine-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
  });
});

// 切换开关
document.querySelectorAll('.toggle').forEach(tg => {
  tg.addEventListener('click', () => tg.classList.toggle('on'));
});

// Toast
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  setTimeout(() => toast.className = 'toast', 2500);
}

// 保存
document.getElementById('save').addEventListener('click', () => {
  showToast('设置已保存', 'success');
});

// 推荐配置
document.getElementById('applyRecommended').addEventListener('click', () => {
  showToast('已应用推荐配置', 'success');
});
</script>
</body>
</html>
