[package]
name = "winocr-host-rust"
version = "0.1.0"
edition = "2021"
description = "WinOCR-Html Rust Edition"
license = "MIT"
build = "build.rs"

[[bin]]
name = "winocr_host"
path = "src/main.rs"

[dependencies]
ort = { version = "2.0.0-rc.13", features = ["half", "load-dynamic"] }
ndarray = "0.17"
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi",
    "dxgi",
    "dxgi1_2",
    "d3d11",
    "winbase",
    "handleapi",
    "errhandlingapi",
    "synchapi",
    "combaseapi",
    "objbase",
    "unknwnbase",
    "guiddef",
    "dxgitype",
    "dxgiformat",
    "windef",
    "minwindef",
    "minwinbase",
    "ntdef",
    "shellapi",
    "libloaderapi",
    "processthreadsapi",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
winit = "0.30"
wgpu = "0.20"
pollster = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
thiserror = "1.0"
anyhow = "1.0"
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Storage",
    "Storage_Streams",
    "Graphics_Imaging",
    "Media_Ocr",
    "Globalization",
] }
env_logger = "0.11"
log = "0.4"
dirs = "5.0"
clipboard = "0.5"
base64 = "0.22"
libloading = "0.8"
parking_lot = "0.12"
regex = "1"
md5 = "0.8"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Memory",
    "Win32_System_Kernel",
] }
