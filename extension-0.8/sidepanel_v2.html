<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>WinOCR-Html v2</title>
<style>
/* =========================================================================
   WinOCR-Html v2 · 第一性原理设计
   核心原则：单一主流程 + 渐进披露 + 最小认知负荷
   ========================================================================= */
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --accent:#2563eb; --accent-ink:#1d4ed8; --accent-light:#dbeafe;
  --ok:#16a34a; --ok-light:#dcfce7;
  --err:#dc2626; --warn:#d97706;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 12px rgba(0,0,0,.1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,monospace;
  --transition:200ms cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f172a; --surface:#1e293b; --surface-2:#334155;
    --text:#f1f5f9; --muted:#94a3b8; --faint:#64748b;
    --border:#334155; --border-strong:#475569;
    --accent:#3b82f6; --accent-ink:#60a5fa; --accent-light:#1e3a8a;
    --ok:#22c55e; --ok-light:#14532d;
    --ef:#ef4444; --warn:#f59e0b;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  font-size:14px;
  line-height:1.6;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ---- 顶部导航 ---- */
.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-ink) 100%);
  color:#fff;
}
.nav h1{
  font-size:18px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}
.nav .version{
  font-size:10px;
  background:rgba(255,255,255,.2);
  padding:2px 8px;
  border-radius:10px;
  font-family:var(--font-mono);
}
.nav .settings-btn{
  width:32px;
  height:32px;
  border:none;
  background:rgba(255,255,255,.15);
  border-radius:8px;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  transition:background var(--transition);
}
.nav .settings-btn:hover{background:rgba(255,255,255,.25)}

/* ---- Tab 切换 ---- */
.tabs{
  display:flex;
  gap:4px;
  padding:8px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.tab{
  flex:1;
  padding:10px 12px;
  border:none;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:all var(--transition);
  position:relative;
}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab.active{
  color:var(--accent);
  background:var(--accent-light);
  font-weight:600;
}
.tab .badge{
  position:absolute;
  top:4px;
  right:4px;
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  display:none;
}
.tab.active .badge{display:block}

/* ---- v2 侧栏布局增强 ---- */
.tab-panel{
  display:none;
  flex:1;
  min-height:0;
  flex-direction:column;
}
.tab-panel,.input-section,.result-section,.ocr-section{min-width:0}
/* 设置面板开关（toggle） */
.toggle{width:42px;height:24px;border-radius:12px;background:var(--border-strong);cursor:pointer;position:relative;flex:0 0 auto;transition:background var(--transition)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--transition)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}

/* ---- 主内容区 ---- */
.main{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  overflow:hidden;
}

/* ---- 输入区 ---- */
.input-section{
  padding:16px;
  background:var(--surface);
}
.lang-bar{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.lang-select{
  flex:1;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--bg);
  color:var(--text);
  font-size:13px;
  font-family:var(--font);
  cursor:pointer;
  transition:border-color var(--transition);
}
.lang-select:hover{border-color:var(--accent)}
.lang-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.lang-swap{
  width:32px;
  height:32px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface);
  color:var(--muted);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  transition:all var(--transition);
}
.lang-swap:hover{border-color:var(--accent);color:var(--accent);transform:rotate(180deg)}

.textarea{
  width:100%;
  min-height:80px;
  max-height:120px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.6;
  font-family:var(--font);
  resize:vertical;
  transition:border-color var(--transition);
}
.textarea::placeholder{color:var(--faint)}
.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}

/* ---- 翻译按钮 ---- */
.translate-btn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-ink) 100%);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:all var(--transition);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.translate-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.translate-btn:active{transform:translateY(0)}
.translate-btn:disabled{opacity:.6;cursor:not-allowed}
.translate-btn .spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  display:none;
}
.translate-btn.loading .spinner{display:block}

@keyframes spin{to{transform:rotate(360deg)}}

/* ---- 结果区 ---- */
.result-section{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:16px;
  overflow:hidden;
}
.result-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.result-label{
  font-size:11px;
  font-weight:600;
  color:var(--ok);
  text-transform:uppercase;
  letter-spacing:.5px;
}
.result-actions{
  display:flex;
  gap:4px;
}
.icon-btn{
  width:28px;
  height:28px;
  border:1px solid var(--border);
  border-radius:6px;
  background:var(--surface);
  color:var(--muted);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  transition:all var(--transition);
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.speaking{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 语音输入按钮 */
.input-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
}
.mic-btn {
  width: 40px;
  height: 40px;
  border: 2px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}
.mic-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}
.mic-btn.recording {
  border-color: var(--err);
  background: var(--err);
  color: #fff;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.mic-status {
  font-size: 11px;
  color: var(--muted);
  flex: 1;
}

.result-card{
  flex:1;
  padding:16px;
  background:var(--ok-light);
  border:1px solid #bbf7d0;
  border-radius:var(--radius);
  overflow:auto;
}
@media (prefers-color-scheme: dark){
  .result-card{background:#14532d;border-color:#166534}
}
.result-text{
  font-size:15px;
  line-height:1.7;
  color:var(--text);
  white-space:pre-wrap;
  word-break:break-word;
}
.result-placeholder{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
  color:var(--faint);
  text-align:center;
}
.result-placeholder .icon{font-size:32px;margin-bottom:8px;opacity:.5}
.result-placeholder p{font-size:13px;max-width:200px}

/* ---- 项目管理条 ---- */
.project-bar{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.project-bar select{flex:1;min-height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px}
.project-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.project-btn:hover{border-color:var(--accent);color:var(--accent)}
.project-btn#historyProjectDel:hover,.project-btn#studyProjectDel:hover,.project-btn#exportProjectDel:hover{border-color:var(--err);color:var(--err)}
/* ---- 底部工具栏 ---- */
.toolbar{
  display:flex;
  gap:8px;
  padding:12px 16px;
  background:var(--surface);
  border-top:1px solid var(--border);
}
.tool-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:8px 4px;
  border:none;
  border-radius:var(--radius-sm);
  background:transparent;
  color:var(--muted);
  font-size:11px;
  cursor:pointer;
  transition:all var(--transition);
}
.tool-btn:hover{background:var(--surface-2);color:var(--accent)}
.tool-btn .icon{font-size:18px}

/* ---- OCR Tab 内容 ---- */
.ocr-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  min-height:0;
  padding:32px 24px;
  text-align:center;
}
.drop-zone{
  width:100%;
  padding:40px 20px;
  border:2px dashed var(--border-strong);
  border-radius:var(--radius);
  background:var(--surface-2);
  cursor:pointer;
  transition:all var(--transition);
}
.drop-zone:hover,.drop-zone.drag{
  border-color:var(--accent);
  background:var(--accent-light);
}
.drop-zone .icon{font-size:40px;margin-bottom:12px;opacity:.6}
.drop-zone h3{font-size:15px;margin-bottom:4px;color:var(--text)}
.drop-zone p{font-size:12px;color:var(--muted)}
.ocr-preview{
  width:100%;
  max-height:200px;
  object-fit:contain;
  border-radius:var(--radius-sm);
  margin-top:12px;
  display:none;
}

/* ---- 设置面板 ---- */
.settings-panel{
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  width:100%;
  background:var(--surface);
  transform:translateX(100%);
  transition:transform var(--transition);
  z-index:100;
  display:flex;
  flex-direction:column;
}
.settings-panel.open{transform:translateX(0)}
.settings-hd{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  border-bottom:1px solid var(--border);
}
.settings-hd h2{font-size:16px;font-weight:600}
.settings-hd .back-btn{
  width:32px;
  height:32px;
  border:none;
  background:var(--surface-2);
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
  color:var(--text);
}
.settings-content{
  flex:1;
  padding:16px;
  overflow:auto;
}
.setting-group{margin-bottom:24px}
.setting-group h3{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:12px;
}
.setting-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.setting-item:last-child{border:none}
.setting-item label{font-size:13px;color:var(--text)}
.setting-item select{
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:6px;
  background:var(--bg);
  font-size:12px;
  color:var(--text);
}

/* ---- Toast ---- */
.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:10px 20px;
  background:var(--text);
  color:var(--surface);
  font-size:13px;
  border-radius:20px;
  box-shadow:var(--shadow-lg);
  opacity:0;
  pointer-events:none;
  transition:all var(--transition);
  z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--err)}

/* ---- 滚动条 ---- */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ---- 动画 ---- */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn var(--transition) both}
</style>
</head>
<body>
<!-- 顶部导航 -->
<nav class="nav">
  <h1>WinOCR <span class="version">v0.8</span></h1>
  <button class="settings-btn" id="openSettings" title="设置">⚙️</button>
</nav>

<!-- Tab 切换 -->
<div class="tabs" role="tablist">
  <button class="tab active" data-tab="translate" role="tab">翻译 <span class="badge"></span></button>
  <button class="tab" data-tab="ocr" role="tab">OCR <span class="badge"></span></button>
  <button class="tab" data-tab="ai" role="tab">AI <span class="badge"></span></button>
</div>

<!-- 主内容 -->
<div class="main" id="mainContent">
  <!-- 翻译 Tab -->
  <div class="tab-panel" id="panel-translate">
    <div class="input-section">
      <div class="lang-bar">
        <select class="lang-select" id="srcLang">
          <option value="auto">自动检测</option>
          <option value="en">英语</option>
          <option value="zh">中文</option>
          <option value="ja">日语</option>
        </select>
        <button class="lang-swap" id="swapLang" title="交换语言">⇄</button>
        <select class="lang-select" id="tgtLang">
          <option value="zh">中文</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
        </select>
      </div>
      <textarea class="textarea" id="inputText" placeholder="输入或粘贴文本...&#10;Ctrl+Enter 快速翻译&#10;或点击 🎤 语音输入"></textarea>
      <div class="input-actions">
        <button class="mic-btn" id="micBtn" title="语音输入">🎤</button>
        <span class="mic-status" id="micStatus"></span>
      </div>
      <button class="translate-btn" id="translateBtn">
        <span class="spinner"></span>
        <span class="text">翻译 →</span>
      </button>
    </div>
    <div class="result-section">
      <div class="result-header">
        <span class="result-label">译文</span>
        <div class="result-actions">
          <button class="icon-btn" id="copyResult" title="复制">📋</button>
          <button class="icon-btn" id="speakResult" title="朗读">🔊</button>
          <button class="icon-btn" id="saveResult" title="收藏">⭐</button>
        </div>
      </div>
      <div class="result-card" id="resultCard">
        <div class="result-placeholder">
          <div class="icon">💬</div>
          <p>译文将显示在此<br>划词后自动翻译</p>
        </div>
        <div class="result-text" id="resultText" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- OCR Tab -->
  <div class="tab-panel" id="panel-ocr" style="display:none">
    <div class="ocr-section">
      <div class="drop-zone" id="dropZone">
        <div class="icon">📷</div>
        <h3>拖入或粘贴图片</h3>
        <p>Ctrl+V 粘贴 / 点击选择图片 / 拖入 PDF</p>
        <img class="ocr-preview" id="ocrPreview" />
      </div>
      <div class="result-card" id="ocrResult" style="display:none;margin-top:12px">
        <div class="result-text" id="ocrText"></div>
        <div class="result-text" id="ocrTrans" style="display:none;margin-top:12px;border-top:1px solid #bbf7d0;padding-top:12px"></div>
      </div>
      <button class="translate-btn" id="ocrTranslate" style="display:none;margin-top:12px">翻译此文本 →</button>
      <input type="file" id="ocrFile" accept="image/*" style="display:none" />
      <button class="translate-btn" id="pickPdf" style="margin-top:12px">翻译 PDF 文件</button>
      <input type="file" id="pdfFile" accept="application/pdf,.pdf" style="display:none" />
      <div id="pdfStatus" style="display:none;font-size:12px;color:var(--muted);margin-top:8px"></div>
      <div class="result-card" id="pdfResult" style="display:none;margin-top:12px;max-height:420px;overflow:auto"></div>
      <button class="translate-btn" id="pdfDownload" style="display:none;margin-top:12px">下载双语结果 TXT</button>
    </div>
  </div>

  <!-- AI Tab -->
  <div class="tab-panel" id="panel-ai" style="display:none">
    <div class="result-card" id="aiMessages" style="flex:1;min-height:0;overflow:auto;margin:12px"></div>
    <div class="input-actions" style="padding:0 12px 12px">
      <textarea class="textarea" id="aiInput" placeholder="输入问题…" style="min-height:48px;max-height:80px"></textarea>
      <button class="translate-btn" id="aiSend" style="margin-top:0;flex:0 0 auto;width:auto;padding:10px 16px">发送</button>
    </div>
  </div>
</div>

<!-- 底部工具栏 -->
<div class="toolbar">
  <button class="tool-btn" id="btnHistory">
    <span class="icon">📝</span>
    <span>历史</span>
  </button>
  <button class="tool-btn" id="btnStudy">
    <span class="icon">📚</span>
    <span>学习</span>
  </button>
  <button class="tool-btn" id="btnExport">
    <span class="icon">📤</span>
    <span>导出</span>
  </button>
  <button class="tool-btn" id="btnSettings">
    <span class="icon">⚙️</span>
    <span>设置</span>
  </button>
</div>

<!-- 设置面板 -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-hd">
    <button class="back-btn" id="closeSettings">←</button>
    <h2>设置</h2>
  </div>
  <div class="settings-content">
    <div class="setting-group">
      <h3>翻译引擎</h3>
      <div class="setting-item">
        <label>默认引擎</label>
        <select id="engineSelect">
          <option value="SiliconFlow">SiliconFlow</option>
          <option value="MyMemory">MyMemory</option>
          <option value="Ollama">Ollama</option>
        </select>
      </div>
      <div class="setting-item">
        <label>API Key</label>
        <select><option>已配置</option></select>
      </div>
    </div>
    <div class="setting-group">
      <h3>OCR 设置</h3>
      <div class="setting-item">
        <label>本地引擎</label>
        <select>
          <option>PP-OCRv6 Tiny</option>
          <option>PP-OCRv6 Small</option>
          <option>PP-OCRv6 Medium</option>
        </select>
      </div>
    </div>
    <div class="setting-group">
      <h3>🎤 语音输入 (ASR)</h3>
      <div class="setting-item">
        <label>ASR 引擎</label>
        <select id="asrEngine">
          <option value="browser">浏览器内置（零依赖，需联网）</option>
          <option value="sf">SiliconFlow（高质量，需联网）</option>
          <option value="whisper">本地 Whisper（离线，需模型）</option>
        </select>
      </div>
      <div class="setting-item">
        <label>识别语言</label>
        <select id="asrLang">
          <option value="auto">自动检测</option>
          <option value="zh">中文</option>
          <option value="en">英文</option>
          <option value="ko">韩语</option>
        </select>
      </div>
      <div class="setting-item">
        <label>SiliconFlow ASR 模型</label>
        <select id="sfAsrModel">
          <option value="FunAudioLLM/SenseVoiceSmall">FunAudioLLM/SenseVoiceSmall（中英双语，免费）</option>
          <option value="Qwen/Qwen3-ASR-1.7B">Qwen/Qwen3-ASR-1.7B（阿通义千问语音，免费）</option>
          <option value="TeleAI/TeleSpeechASR">TeleAI/TeleSpeechASR（多语种，免费）</option>
        </select>
      </div>
      <div class="toggle-row">
        <label>自动发送识别结果</label>
        <div class="toggle" id="toggleAutoSendAsr"></div>
      </div>
    </div>
    <div class="setting-group">
      <h3>🔊 语音输出 (TTS)</h3>
      <div class="setting-item">
        <label>默认语音</label>
        <select id="ttsVoice">
          <option value="auto">自动选择</option>
        </select>
      </div>
      <div class="setting-item">
        <label>语速</label>
        <select id="ttsRate">
          <option value="0.8">0.8x 慢速</option>
          <option value="1.0" selected>1.0x 正常</option>
          <option value="1.2">1.2x 快速</option>
          <option value="1.5">1.5x 极速</option>
        </select>
      </div>
      <div class="setting-item">
        <label>音调</label>
        <select id="ttsPitch">
          <option value="0.8">低沉</option>
          <option value="1.0" selected>正常</option>
          <option value="1.2">高亢</option>
        </select>
      </div>
      <div class="toggle-row">
        <label>自动朗读译文</label>
        <div class="toggle" id="toggleAutoSpeak"></div>
      </div>
    </div>
    <div class="setting-group">
      <div class="setting-item">
        <label>版本</label>
        <span style="font-size:12px;color:var(--muted)">v0.8.0</span>
      </div>
    </div>
  </div>
</div>

<!-- 历史记录面板 -->
<div class="settings-panel" id="historyPanel">
  <div class="settings-hd">
    <button class="back-btn" id="closeHistory">←</button>
    <h2>历史记录</h2>
  </div>
  <div class="settings-content">
    <div class="project-bar">
      <select id="historyProject"></select>
      <button class="project-btn" id="historyProjectNew">＋</button>
      <button class="project-btn" id="historyProjectDel" title="删除当前项目">🗑</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- 学习（生词本）面板 -->
<div class="settings-panel" id="studyPanel">
  <div class="settings-hd">
    <button class="back-btn" id="closeStudy">←</button>
    <h2>学习</h2>
  </div>
  <div class="settings-content">
    <div class="project-bar">
      <select id="studyProject"></select>
      <button class="project-btn" id="studyProjectNew">＋</button>
      <button class="project-btn" id="studyProjectDel" title="删除当前项目">🗑</button>
    </div>
    <div id="studyStats"></div>
    <div id="studyQueue"></div>
  </div>
</div>

<!-- 导出面板 -->
<div class="settings-panel" id="exportPanel">
  <div class="settings-hd">
    <button class="back-btn" id="closeExport">←</button>
    <h2>导出</h2>
  </div>
  <div class="settings-content">
    <div class="project-bar">
      <select id="exportProject"></select>
      <button class="project-btn" id="exportProjectNew">＋</button>
      <button class="project-btn" id="exportProjectDel" title="删除当前项目">🗑</button>
    </div>
    <button class="translate-btn" id="exportFolder" style="margin-top:0">导出到文件夹</button>
    <button class="translate-btn" id="exportZip" style="margin-top:12px">导出为 ZIP</button>
    <div id="exportStatus" style="margin-top:12px;font-size:13px;color:var(--muted)"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="js/common.js"></script>

<script src="js/sidepanel-v2.js"></script>
</body>
</html>
